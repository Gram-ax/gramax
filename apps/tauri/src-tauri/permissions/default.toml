"$schema" = "../gen/schemas/acl-manifests.json"

[default]
description = "Default permissions for Gramax application commands on local app windows."
permissions = [
  "allow-read-env",
  "allow-quit",
  "allow-get-user-language",
  "allow-http-listen-once",
  "allow-open-in-web",
  "allow-http-request",
  "allow-get-settings",
  "allow-set-settings",
  "allow-close-current-window",
  "allow-minimize-window",
  "allow-new-window",
  "allow-open-directory",
  "allow-open-in-explorer",
  "allow-open-window-with-url",
  "allow-move-to-trash",
  "allow-set-menuitem-spellcheck-enabled",
  "allow-update-check",
  "allow-update-install",
  "allow-update-cache-clear",
  "allow-update-install-by-path",
  "allow-update-reset-bytes",
  "allow-restart-app",
  "allow-history-back-forward-go",
  "allow-history-back-forward-can-go",
  "allow-set-language",
  "allow-set-session-data",
  "allow-show-print",
  "allow-set-badge",
  "allow-collect-logs",
  "allow-set-otel-level",
]

[[permission]]
identifier = "allow-read-env"
commands.allow = ["read_env"]

[[permission]]
identifier = "allow-quit"
commands.allow = ["quit"]

[[permission]]
identifier = "allow-get-user-language"
commands.allow = ["get_user_language"]

